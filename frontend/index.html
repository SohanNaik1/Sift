<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sift</title>
    <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
    <!-- Top Action Bar & Search -->
    <header class="header">
        <div class="header-left">
            <span style="font-weight:600; font-size: 1.1rem;">Sift</span>
        </div>
        <div class="header-center">
            <input type="text" id="search-bar" class="search-input" placeholder="Search files or enter path... (Ctrl+F)" autocomplete="off" spellcheck="false"/>
        </div>
        <div class="header-right">
            <button id="btn-home" class="action-btn" title="Go Home (~)">&larr; Home</button>
            <div class="divider"></div>
            <button id="btn-hotkeys" class="action-btn" title="View Keybindings">?</button>
            <div class="divider"></div>
            <button id="btn-quit" class="action-btn danger">Quit</button>
        </div>
    </header>

    <!-- Hotkey Modal -->
    <div id="hotkey-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Keybindings</h3>
                <button id="btn-close-modal" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="hotkey-row"><kbd>↑</kbd> <kbd>↓</kbd> <span>Navigate Files</span></div>
                <div class="hotkey-row"><kbd>Enter</kbd> <span>Open File</span></div>
                <div class="hotkey-row"><kbd>R</kbd> <span>Trash File</span></div>
                <div class="hotkey-row"><kbd>1-9</kbd> <span>Quick Move to Preset</span></div>
                <div class="hotkey-row"><kbd>Ctrl+F</kbd> <span>Focus Search</span></div>
                <div class="hotkey-row"><kbd>Esc</kbd> <span>Unfocus / Close Modal</span></div>
                <hr style="border: 1px solid var(--border); margin: 8px 0;" />
                <h4 style="margin-bottom: 4px;">Quick Move Presets</h4>
                <div id="quick-targets-modal-group" class="quick-targets-group" style="flex-wrap: wrap;"></div>
            </div>
        </div>
    </div>

    <div id="app">
        <!-- Sidebar: File List -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="path-display" id="current-path">~</div>
            </div>
            <div class="file-list-container">
                <ul id="file-list" class="file-list">
                    <!-- Populated via TS -->
                </ul>
            </div>
        </aside>

        <!-- Main Content: Right Pane (60%) -->
        <main class="right-pane">
            <!-- Top Preview Pane -->
            <div class="preview-top" id="preview-content">
                <div class="empty-state"><div class="empty-state-icon">Ø</div><p>Select a file</p></div>
            </div>
            
            <!-- Bottom Metadata & Triage Pane -->
            <div class="metadata-bottom">
                <div class="metadata-header">
                    <h2 id="preview-title">Select a file</h2>
                    <div id="file-meta" class="file-meta"></div>
                </div>
                <div class="triage-deck">
                    <button id="btn-open" class="action-btn" title="Open selected file">Open</button>
                    <button id="btn-trash" class="action-btn danger" title="Trash selected file">Trash</button>
                    <button id="btn-trash-portal" class="action-btn warning" title="View Sift Trash Directory">Recycle Bin</button>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
