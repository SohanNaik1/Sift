name: Release Pipeline

on:
  release:
    types: [published]

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (amd64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install GTK & WebKit2GTK 4.0
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build -m -platform linux/amd64

      - name: Rename
        run: mv build/bin/sift build/bin/sift-linux-amd64

      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: build/bin/sift-linux-amd64

  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build -m -platform windows/amd64 -nsis

      - name: Rename Installer
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path build/bin -Filter "*installer*.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $file) {
            $file = Get-ChildItem -Path build/bin -Filter "*.exe" | Select-Object -First 1
          }
          Rename-Item -Path $file.FullName -NewName "sift-windows-installer.exe"

      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: build/bin/sift-windows-installer.exe

  # ── macOS ────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build -m -platform darwin/universal

      - name: Package App Bundle
        run: tar -czf build/bin/sift-mac-universal.app.tar.gz -C build/bin sift.app

      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: build/bin/sift-mac-universal.app.tar.gz
