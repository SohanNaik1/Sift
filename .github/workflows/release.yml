name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and Release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            name: sift-linux-amd64
          - os: windows-latest
            platform: windows/amd64
            name: sift-windows-amd64.exe
          - os: macos-latest
            platform: darwin/universal
            name: sift-darwin-universal.app
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      - name: Build Wails App
        run: wails build -m -platform ${{ matrix.platform }}

      - name: Rename Binary (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            mv build/bin/sift build/bin/${{ matrix.name }}
          elif [ "${{ runner.os }}" = "macOS" ]; then
            tar -czf build/bin/${{ matrix.name }}.tar.gz -C build/bin sift.app
          fi

      - name: Rename Binary (Windows)
        if: runner.os == 'Windows'
        run: Rename-Item -Path build/bin/sift.exe -NewName ${{ matrix.name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/bin/sift-linux-amd64
            build/bin/sift-windows-amd64.exe
            build/bin/sift-darwin-universal.app.tar.gz
