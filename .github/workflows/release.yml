name: Release Pipeline

on:
  release:
    types: [published]

jobs:
  build:
    name: Build Product
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            target: sift-linux-amd64
            build_command: "wails build -m -platform linux/amd64"
          - os: windows-latest
            platform: windows/amd64
            target: sift-windows-installer.exe
            build_command: "wails build -m -platform windows/amd64 -nsis"
          - os: macos-latest
            platform: darwin/universal
            target: sift-mac-universal.app.tar.gz
            build_command: "wails build -m -platform darwin/universal"
            
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      - name: Install Windows NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Build Wails App
        run: ${{ matrix.build_command }}

      - name: Rename and Package (Linux)
        if: runner.os == 'Linux'
        run: mv build/bin/sift build/bin/${{ matrix.target }}

      - name: Rename and Package (Windows)
        if: runner.os == 'Windows'
        run: Rename-Item -Path build/bin/sift-amd64-installer.exe -NewName ${{ matrix.target }} -ErrorAction SilentlyContinue || Rename-Item -Path build/bin/sift.exe -NewName ${{ matrix.target }}

      - name: Rename and Package (Mac)
        if: runner.os == 'macOS'
        run: tar -czf build/bin/${{ matrix.target }} -C build/bin sift.app

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: build/bin/${{ matrix.target }}
